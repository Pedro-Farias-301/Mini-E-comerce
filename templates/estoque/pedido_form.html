{% extends "base.html" %}

{% block title %}Novo Pedido{% endblock %}

{% block content %}
<div class="form-container card p-4">
    <h2>Criar Novo Pedido</h2>
    <p class="subtitle">Selecione o vendedor responsável e, opcionalmente, um cupom de desconto.</p>

    <form method="post" class="mt-4">
        {% csrf_token %}
        <div class="form-group mb-3">
            <label class="form-label">Vendedor Responsável:</label>
            {{ form.vendedor }}
        </div>
        <div class="form-group mb-3">
            <label class="form-label">Cupom de Desconto (opcional):</label>
            {{ form.cupom }}
        </div>
        <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-action btn-lg">Criar Pedido e Ir ao Carrinho</button>
            <a href="{% url 'pedidos_lista' %}" class="btn btn-outline btn-lg">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
