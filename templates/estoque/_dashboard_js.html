{% comment %}P2 — Script dos gráficos do dashboard (Chart.js via CDN). Lê os dados do json_script "dados-dashboard".{% endcomment %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
(function () {
    const dados = JSON.parse(document.getElementById("dados-dashboard").textContent);
    if (typeof Chart === "undefined") {
        document.getElementById("chart-fallback").style.display = "block";
        return;
    }
    const cores = ["#0d9488", "#2563eb", "#f59e0b", "#e11d48", "#7c3aed", "#0891b2", "#65a30d", "#db2777"];
    const brl = (v) => v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
    Chart.defaults.font.family = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';

    function criar(id, config) {
        const el = document.getElementById(id);
        if (el) new Chart(el, config);
    }

    criar("grafico-dias", {
        type: "line",
        data: {
            labels: dados.vendas_por_dia.map((d) => d.data.split("-").reverse().slice(0, 2).join("/")),
            datasets: [{
                label: "Faturamento",
                data: dados.vendas_por_dia.map((d) => d.valor),
                borderColor: "#0d9488", backgroundColor: "rgba(13,148,136,0.12)", fill: true, tension: 0.3, pointRadius: 2,
            }],
        },
        options: {
            maintainAspectRatio: false,
            plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => brl(c.parsed.y) } } },
            scales: { y: { beginAtZero: true, ticks: { callback: (v) => brl(v) } } },
        },
    });

    criar("grafico-categorias", {
        type: "doughnut",
        data: {
            labels: dados.vendas_por_categoria.map((c) => c.categoria),
            datasets: [{ data: dados.vendas_por_categoria.map((c) => c.valor), backgroundColor: cores }],
        },
        options: {
            maintainAspectRatio: false,
            plugins: { legend: { position: "bottom" }, tooltip: { callbacks: { label: (c) => `${c.label}: ${brl(c.parsed)}` } } },
        },
    });

    criar("grafico-lojas", {
        type: "bar",
        data: {
            labels: dados.vendas_por_loja.map((l) => l.loja),
            datasets: [{ label: "Faturamento", data: dados.vendas_por_loja.map((l) => l.valor), backgroundColor: cores }],
        },
        options: {
            indexAxis: "y", maintainAspectRatio: false,
            plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => brl(c.parsed.x) } } },
            scales: { x: { beginAtZero: true, ticks: { callback: (v) => brl(v) } } },
        },
    });

    criar("grafico-status", {
        type: "bar",
        data: {
            labels: dados.subpedidos_por_status.map((s) => s.label),
            datasets: [{
                label: "Sub-pedidos",
                data: dados.subpedidos_por_status.map((s) => s.total),
                backgroundColor: ["#f59e0b", "#2563eb", "#0d9488", "#e11d48"],
            }],
        },
        options: {
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: { y: { beginAtZero: true, ticks: { precision: 0 } } },
        },
    });
})();
</script>
